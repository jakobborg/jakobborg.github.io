<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wiki</title>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
        padding: 2rem;
        max-width: 46rem;
      }
      #error {
        color: #b00;
      }
    </style>
  </head>
  <body>
    <main id="content">Loading…</main>
    <script>
      const content = document.getElementById("content");

      function slug() {
        const hash = location.hash.replace(/^#\/?/, "").replace(/\.md$/, "");
        return decodeURIComponent(hash);
      }

      async function load() {
        const page = slug();
        if (!page) {
          content.textContent = "No page specified. Try /wiki.html#/about";
          return;
        }
        content.textContent = "Loading…";
        try {
          const res = await fetch(`/content/${page}.md`);
          if (!res.ok) throw new Error(res.status + " " + res.statusText);
          content.innerHTML = render(await res.text());
          document.title = page;
        } catch (err) {
          content.innerHTML = "";
          const el = document.createElement("p");
          el.id = "error";
          el.textContent = "Could not load page '" + page + "': " + err.message;
          content.appendChild(el);
        }
      }

      function inline(text) {
        const esc = (s) =>
          s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        let out = esc(text);
        out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
        out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        out = out.replace(/\*([^*]+)\*/g, "<em>$1</em>");
        out = out.replace(
          /\[([^\]]+)\]\(([^)]+)\)/g,
          '<a href="$2">$1</a>'
        );
        return out;
      }

      function render(md) {
        const blocks = md.replace(/\r\n/g, "\n").split(/\n{2,}/);
        return blocks
          .map((block) => {
            const lines = block.split("\n");
            const heading = lines[0].match(/^(#{1,6})\s+(.*)$/);
            if (heading) {
              const level = heading[1].length;
              return `<h${level}>${inline(heading[2])}</h${level}>`;
            }
            if (/^(-|\*|\d+\.)\s/.test(lines[0])) {
              const ordered = /^\d+\.\s/.test(lines[0]);
              const items = lines.map((line) =>
                line.replace(/^(-|\*|\d+\.)\s+/, "")
              );
              const tag = ordered ? "ol" : "ul";
              return `<${tag}>${items
                .map((item) => `<li>${inline(item)}</li>`)
                .join("")}</${tag}>`;
            }
            if (/^>\s?/.test(lines[0])) {
              return `<blockquote>${inline(
                lines.map((l) => l.replace(/^>\s?/, "")).join(" ")
              )}</blockquote>`;
            }
            if (block.startsWith("```")) {
              return `<pre><code>${block
                .replace(/^```\w*\n?/, "")
                .replace(/\n?```$/, "")}</code></pre>`;
            }
            return `<p>${inline(lines.join(" "))}</p>`;
          })
          .join("\n");
      }

      window.addEventListener("hashchange", load);
      window.addEventListener("DOMContentLoaded", load);
    </script>
  </body>
</html>
